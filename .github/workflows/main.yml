name: Build Bestie Budget APK

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f "indeks.html" ]; then
            cp indeks.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "HTML file not found"
            exit 1
          fi
          if [ -f "data.json" ]; then
            cp data.json www/data.json
          fi

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Bestie Budget" "com.bestie.budget" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Fix Kotlin stdlib conflict & Build Debug APK
        run: |
          python3 -c '
          p = "android/build.gradle"
          with open(p, "r") as f:
              c = f.read()
          rule = """
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {
                details.useVersion "1.8.22"
            }
        }
    }
}
"""
          if "resolutionStrategy.eachDependency" not in c:
              with open(p, "w") as f:
                  f.write(c + "\n" + rule)
          '
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bestie-Budget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
