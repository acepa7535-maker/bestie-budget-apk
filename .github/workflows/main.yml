name: Build Bestie Budget APK

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f "indeks.html" ]; then
            cp indeks.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "HTML file not found"
            exit 1
          fi
          if [ -f "data.json" ]; then
            cp data.json www/data.json
          fi

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Bestie Budget" "com.bestie.budget" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bestie-Budget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
